name: Update MAP
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/gen_map.py
      - name: Commit if changed
        run: |
          git config user.name "automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/MAP.md
          git diff --staged --quiet || git commit -m "chore(docs): refresh MAP quicklinks"
          git push